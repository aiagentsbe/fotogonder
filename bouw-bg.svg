<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice">
  <!-- Gün batımında şantiye (uygulamanın üst arka planı). Üstte boş gökyüzü (üst satır), altta vinç + bina iskeleti + şehir. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd7bd"/>
      <stop offset=".55" stop-color="#ffb98f"/>
      <stop offset=".88" stop-color="#ffc9a8"/>
      <stop offset="1" stop-color="#fff1ea"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset=".5" stop-color="#ffe0a8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffb98f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="200" fill="url(#sky)"/>
  <circle cx="262" cy="150" r="58" fill="url(#sun)"/>

  <!-- uzak şehir -->
  <path fill="#f0a283" opacity=".7" d="M0 200v-38h16v-18h12v24h10v-30h18v30h8v-14h14v14h12v-40h6v-8h6v48h12v-20h16v20h10v-30h20v30h8v-12h12v12h12v-26h14v26h10v-18h16v18h12v-34h8v34h10v-16h14v16h12v-24h16v24h10v-14h14v14h12v38z"/>

  <!-- bina iskeleti -->
  <g stroke="#a8553f" fill="none" opacity=".85">
    <path d="M34 200V118h96v82M34 118h96M34 139h96M34 160h96M34 181h96M58 118v82M82 118v82M106 118v82" stroke-width="2.4"/>
    <path d="M34 139l24-21M58 160l24-21M82 181l24-21M106 139l24-21" stroke-width="1.1"/>
    <path d="M106 118v-16h24v16" stroke-width="2"/>
  </g>

  <!-- kule vinç -->
  <g stroke="#7d3b2e" fill="none">
    <!-- direk -->
    <path d="M318 200V96M332 200V96" stroke-width="2.4"/>
    <path d="M318 200l14-13-14-13 14-13-14-13 14-13-14-13 14-13-14-13" stroke-width="1.1"/>
    <!-- tepe ve gergi halatları -->
    <path d="M318 86l7-24 7 24" stroke-width="2"/>
    <path d="M325 62L184 84M325 62L398 84" stroke-width=".9"/>
    <!-- bom (kafes) -->
    <path d="M180 84H400M180 93H400" stroke-width="2"/>
    <path d="M180 93l9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9" stroke-width=".9"/>
    <path d="M180 84v9" stroke-width="2"/>
    <!-- kabin, karşı ağırlık -->
    <rect x="313" y="93" width="24" height="12" rx="2" fill="#7d3b2e" stroke="none"/>
    <rect x="372" y="93" width="22" height="13" fill="#7d3b2e" stroke="none"/>
    <!-- araba, halat, kanca, yük (kiriş) -->
    <rect x="221" y="93" width="10" height="4" fill="#7d3b2e" stroke="none"/>
    <path d="M226 97V146" stroke-width=".9"/>
    <path d="M222 146h8l-4 6z" fill="#7d3b2e" stroke="none"/>
    <path d="M214 152l12 4 12-4" stroke-width=".9"/>
    <rect x="200" y="156" width="52" height="7" rx="1" fill="#c4532f" stroke="none"/>
  </g>
</svg>
