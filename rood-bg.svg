<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" preserveAspectRatio="xMidYMid slice">
  <!-- Uygulama arka planı: koyu kırmızı → siyah, üst üste binen yarı saydam kırmızı paneller, ince dikey çizgiler; üstte koyu vinç silüeti. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#c8000f"/>
      <stop offset=".45" stop-color="#7a0008"/>
      <stop offset="1" stop-color="#1a0103"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8a0010" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="p2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e00012" stop-opacity=".5"/>
      <stop offset="1" stop-color="#300004" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </linearGradient>
    <pattern id="lines" width="5" height="10" patternUnits="userSpaceOnUse">
      <rect width="1" height="10" fill="#ff4a4a" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="400" height="860" fill="url(#base)"/>
  <!-- paneller -->
  <path d="M0 40L190 110V700L0 760Z" fill="url(#p1)"/>
  <path d="M0 40L190 110V700L0 760Z" fill="url(#lines)"/>
  <path d="M150 0H400V520L260 600V160Z" fill="url(#p2)"/>
  <path d="M260 160L400 120V520L260 600Z" fill="url(#lines)"/>
  <path d="M120 300L300 230V860H120Z" fill="#b5000d" opacity=".28"/>
  <path d="M120 300L300 230" stroke="#ff5a5a" stroke-opacity=".35" stroke-width="1.2"/>
  <path d="M190 110V700M260 160V600" stroke="#ff6a6a" stroke-opacity=".25" stroke-width="1"/>
  <rect y="560" width="400" height="300" fill="url(#floor)"/>

  <!-- vinç + bina iskeleti silüeti (üst şerit) -->
  <g stroke="#1c0003" fill="none" opacity=".72">
    <path d="M34 200V118h96v82M34 118h96M34 139h96M34 160h96M34 181h96M58 118v82M82 118v82M106 118v82" stroke-width="2.4"/>
    <path d="M34 139l24-21M58 160l24-21M82 181l24-21M106 139l24-21" stroke-width="1.1"/>
    <path d="M318 200V96M332 200V96" stroke-width="2.4"/>
    <path d="M318 200l14-13-14-13 14-13-14-13 14-13-14-13 14-13-14-13" stroke-width="1.1"/>
    <path d="M318 86l7-24 7 24" stroke-width="2"/>
    <path d="M325 62L184 84M325 62L398 84" stroke-width=".9"/>
    <path d="M180 84H400M180 93H400" stroke-width="2"/>
    <path d="M180 93l9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9 9-9 9 9" stroke-width=".9"/>
    <path d="M180 84v9" stroke-width="2"/>
    <rect x="313" y="93" width="24" height="12" rx="2" fill="#1c0003" stroke="none"/>
    <rect x="372" y="93" width="22" height="13" fill="#1c0003" stroke="none"/>
    <path d="M226 97V146" stroke-width=".9"/>
    <path d="M222 146h8l-4 6z" fill="#1c0003" stroke="none"/>
    <rect x="200" y="156" width="52" height="7" rx="1" fill="#1c0003" stroke="none"/>
  </g>
</svg>
