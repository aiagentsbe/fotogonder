<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foto Gönder">
<title>Foto Gönder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1d231f; --muted: #6b716c; --line: #e3ddd0;
    --green: #1f3a2e; --green-2: #2c5442; --amber: #e8a33d; --red: #b8402c; --ok: #2f7d4f;
    --r: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; display: flex; flex-direction: column; }

  header { background: var(--green); color: #f4f1ea;
    padding: calc(env(safe-area-inset-top) + 18px) 22px 22px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
  header h1 span { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); }
  header p { margin: 4px 0 0; opacity: .75; font-size: 15px; }

  main { flex: 1; padding: 18px 18px 140px; display: flex; flex-direction: column; gap: 16px;
    max-width: 640px; width: 100%; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
  .step { display: flex; align-items: center; gap: 10px; font-weight: 650; margin-bottom: 10px; }
  .num { width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #fff;
    display: grid; place-items: center; font-size: 14px; flex: none; }
  input[type=text] { width: 100%; font: inherit; font-size: 20px; padding: 14px 16px; border-radius: 14px;
    border: 2px solid var(--line); background: #fff; color: var(--ink); outline: none; }
  input[type=text]:focus { border-color: var(--green-2); }

  .actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
  .btn { appearance: none; border: 0; font: inherit; font-weight: 650; border-radius: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px 14px;
    transition: transform .08s, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 26px; height: 26px; flex: none; }
  .btn-cam { background: var(--amber); color: #2a1d06; font-size: 19px; min-height: 76px; }
  .btn-gal { background: #fff; color: var(--green); border: 2px solid var(--line); }
  .file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .grid:empty::before { content: "Henüz foto yok"; grid-column: 1 / -1; color: var(--muted);
    text-align: center; padding: 26px 0; border: 2px dashed var(--line); border-radius: 14px; }
  .ph { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #ddd; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph .x { position: absolute; top: 5px; right: 5px; width: 30px; height: 30px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.55); color: #fff; font-size: 18px; line-height: 30px; padding: 0; cursor: pointer; }
  .ph .st { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; color: #fff; }
  .ph.sending .st { background: rgba(31,58,46,.45); }
  .ph.sending .st::after { content: ""; width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .8s linear infinite; }
  .ph.done .st { background: rgba(47,125,79,.55); }
  .ph.done .st::after { content: "✓"; }
  .ph.fail .st { background: rgba(184,64,44,.6); }
  .ph.fail .st::after { content: "!"; font-weight: 800; }
  .ph.sending .x, .ph.done .x { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 18px calc(env(safe-area-inset-bottom) + 14px);
    background: linear-gradient(to top, var(--bg) 70%, rgba(244,241,234,0)); }
  .bar-in { max-width: 640px; margin: 0 auto; }
  .btn-send { width: 100%; background: var(--green); color: #fff; font-size: 20px; min-height: 64px; position: relative; overflow: hidden; }
  .btn-send:disabled { opacity: .4; }
  .btn-send .prog { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green-2); width: 0; transition: width .3s; }
  .btn-send .lbl { position: relative; }

  .msg { border-radius: 14px; padding: 14px 16px; font-weight: 600; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: #dcefe2; color: #1c5134; }
  .msg.err { background: #f6ded8; color: #7c2716; }
  .setup { text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1><span></span>Foto Gönder</h1>
  <p>Foto çek, gönder. Ofise otomatik gider.</p>
</header>

<main id="app">
  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <section class="card">
    <label class="step" for="customer"><span class="num">1</span>Müşteri adı</label>
    <input id="customer" type="text" list="recent" placeholder="örn. Jansen – Dorpstraat 12"
           autocomplete="off" autocapitalize="words" enterkeyhint="done">
    <datalist id="recent"></datalist>
  </section>

  <section class="card">
    <div class="step"><span class="num">2</span>Fotoğraflar <span id="count" style="color:var(--muted);font-weight:500"></span></div>
    <div class="actions">
      <label class="btn btn-cam" for="cam">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Foto çek
      </label>
      <label class="btn btn-gal" for="gal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>
        Galeri
      </label>
      <input id="cam" class="file" type="file" accept="image/*" capture="environment">
      <input id="gal" class="file" type="file" accept="image/*" multiple>
    </div>
    <div id="grid" class="grid" style="margin-top:14px"></div>
  </section>
</main>

<div class="bar"><div class="bar-in">
  <button id="send" class="btn btn-send" disabled><span class="prog" id="prog"></span><span class="lbl" id="sendLbl">Gönder</span></button>
</div></div>

<script src="config.js"></script>
<script>
(() => {
  const MAX_SIDE = 2560;            // Drive'a giden fotoğrafın uzun kenarı; offerte için fazlasıyla yeterli
  const $ = id => document.getElementById(id);
  const scriptUrl = (window.FOTO_CONFIG || {}).scriptUrl;

  // Anahtar kurulum linkinden (?k=…) gelir. iOS ana ekran uygulaması Safari'nin hafızasını paylaşmaz,
  // bu yüzden link adreste kalır ve ayrıca burada saklanır.
  const urlKey = new URLSearchParams(location.search).get('k');
  if (urlKey) localStorage.setItem('key', urlKey);
  const key = urlKey || localStorage.getItem('key');

  const photos = []; // { file, url, state: '' | 'sending' | 'done' | 'fail', el }
  let busy = false;

  function show(text, kind) {
    const m = $('msg');
    m.textContent = text;
    m.className = 'msg show ' + kind;
    if (kind === 'ok') setTimeout(() => m.className === 'msg show ok' && (m.className = 'msg'), 6000);
  }

  if (!scriptUrl || !key) {
    $('app').innerHTML = '<div class="card setup"><b>Uygulama henüz kurulmamış.</b><br>Size gönderilen kurulum linkini açın.</div>';
    $('send').style.display = 'none';
    return;
  }

  // Son müşteriler: aynı isim farklı yazılıp iki klasör açılmasın diye öneri olarak çıkar.
  const recent = JSON.parse(localStorage.getItem('recent') || '[]');
  $('recent').innerHTML = recent.map(n => `<option value="${n.replace(/"/g, '&quot;')}">`).join('');
  $('customer').value = localStorage.getItem('lastCustomer') || '';

  function refresh() {
    const pending = photos.filter(p => p.state !== 'done').length;
    $('count').textContent = photos.length ? `(${photos.length})` : '';
    $('send').disabled = busy || !pending;
    if (!busy) $('sendLbl').textContent = pending ? `Gönder (${pending} foto)` : 'Gönder';
  }

  function add(files) {
    for (const file of files) {
      const p = { file, url: URL.createObjectURL(file), state: '' };
      p.el = document.createElement('div');
      p.el.className = 'ph';
      p.el.innerHTML = `<img src="${p.url}" alt=""><span class="st"></span><button class="x" aria-label="Fotoğrafı sil">×</button>`;
      p.el.querySelector('.x').onclick = () => {
        if (busy) return;
        photos.splice(photos.indexOf(p), 1);
        URL.revokeObjectURL(p.url);
        p.el.remove();
        refresh();
      };
      photos.push(p);
      $('grid').append(p.el);
    }
    refresh();
  }

  for (const id of ['cam', 'gal']) {
    $(id).addEventListener('change', e => { add(e.target.files); e.target.value = ''; });
  }

  // iPhone fotoğrafları 4–12 MB; küçültüp JPEG yaparak hem hızlı gider hem Apps Script sınırının altında kalır.
  async function toJpegBase64(file) {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    try { await img.decode(); } finally { URL.revokeObjectURL(img.src); }
    const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale);
    c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/jpeg', 0.85);
    c.width = c.height = 0; // iOS Safari'de canvas belleğini hemen bırak
    return dataUrl.slice(dataUrl.indexOf(',') + 1);
  }

  function fileName(i) {
    const d = new Date(), z = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}_${i + 1}.jpg`;
  }

  async function upload(customer, p, i) {
    const body = JSON.stringify({ key, customer, fileName: fileName(i), mimeType: 'image/jpeg', data: await toJpegBase64(p.file) });
    let last;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        // text/plain: tarayıcı ön kontrol (CORS preflight) yapmaz, Apps Script bunu kabul eder.
        const res = await fetch(scriptUrl, { method: 'POST', body, headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
        const out = await res.json();
        if (out.ok) return;
        last = new Error(out.error || 'Bilinmeyen hata');
        if (/anahtar/i.test(last.message)) break; // tekrar denemek işe yaramaz
      } catch (e) { last = e; }
      await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
    }
    throw last;
  }

  $('send').onclick = async () => {
    const customer = $('customer').value.replace(/\s+/g, ' ').trim();
    if (!customer) { show('Önce müşteri adını yazın.', 'err'); $('customer').focus(); return; }
    const todo = photos.filter(p => p.state !== 'done');
    busy = true; refresh();
    $('msg').className = 'msg';
    let sent = 0, failed = 0, lastErr;
    for (const [i, p] of todo.entries()) {
      p.state = 'sending'; p.el.className = 'ph sending';
      $('sendLbl').textContent = `Gönderiliyor… ${i + 1}/${todo.length}`;
      try { await upload(customer, p, i); p.state = 'done'; sent++; }
      catch (e) { p.state = 'fail'; failed++; lastErr = e; }
      p.el.className = 'ph ' + p.state;
      $('prog').style.width = `${((i + 1) / todo.length) * 100}%`;
    }
    busy = false;
    $('prog').style.width = '0';

    localStorage.setItem('lastCustomer', customer);
    const r = [customer, ...JSON.parse(localStorage.getItem('recent') || '[]').filter(n => n.toLowerCase() !== customer.toLowerCase())].slice(0, 30);
    localStorage.setItem('recent', JSON.stringify(r));

    if (failed) {
      // Başarısız fotoğraflar ekranda kalır, "Gönder" ile yeniden denenir; hiçbiri kaybolmaz.
      show(`${sent} foto gönderildi, ${failed} foto gönderilemedi. İnterneti kontrol edip tekrar "Gönder"e basın. (${lastErr && lastErr.message})`, 'err');
    } else {
      show(`✓ ${sent} foto "${customer}" klasörüne gönderildi.`, 'ok');
      setTimeout(() => {
        for (const p of photos.filter(p => p.state === 'done')) { URL.revokeObjectURL(p.url); p.el.remove(); }
        photos.splice(0, photos.length, ...photos.filter(p => p.state !== 'done'));
        refresh();
      }, 1500);
    }
    refresh();
  };

  // Gönderilmemiş foto varken uygulama kapatılmak istenirse uyar.
  addEventListener('beforeunload', e => { if (photos.some(p => p.state !== 'done')) e.preventDefault(); });

  refresh();
})();
</script>
</body>
</html>
