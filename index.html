<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1463e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foto Gönder">
<title>Foto Gönder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* Çelik Kubbe 2.0 görünümü (Ocean teması): geçişli başlık + büyük daire, beyaz yumuşak gölgeli kartlar, parlak rozetler, geçişli hap butonlar. */
  :root {
    --hero-a: #1463e0; --hero-b: #1e9e6a; --hero-a2: #3077e4; --hero-b2: #3aaa7c;
    --bg: #f0f5fc; --card: #ffffff; --field: #eff1f7; --ink: #151823; --muted: #5f6678; --line: #e3e6ef;
    --primary: #1463e0; --primary-soft: #dceaff;
    --ok: #1e9e6a; --ok-bg: #dcf3e8; --ok-ink: #11603f;
    --err: #dc2626; --err-bg: #fee2e2; --err-ink: #7f1d1d;
    --shadow: 0 10px 28px -12px rgba(20, 99, 224, .35), 0 2px 6px -2px rgba(20, 99, 224, .10);
    --card-r: 24px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --hero-a: #0f4bb0; --hero-b: #167a52; --hero-a2: #2a63c0; --hero-b2: #2a8a64;
      --bg: #0e1016; --card: #1b1e29; --field: #222634; --ink: #e6e8ef; --muted: #9ca3b4; --line: #2a2e3d;
      --primary: #8ec0ff; --primary-soft: #1e2c47;
      --ok-bg: #133a2a; --ok-ink: #9be3c1; --err-bg: #4c1d1d; --err-ink: #fecaca;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { min-height: 100dvh; display: flex; flex-direction: column; }
  svg { display: block; }

  /* Başlık */
  header { position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(135deg, var(--hero-a), var(--hero-a2));
    border-radius: 0 0 36px 36px;
    padding: calc(env(safe-area-inset-top) + 22px) 20px 30px 22px; }
  header::before { content: ""; position: absolute; width: 124vw; max-width: 800px; aspect-ratio: 1; border-radius: 50%;
    right: -64vw; top: -70vw; background: linear-gradient(160deg, var(--hero-b), var(--hero-b2)); }
  @media (min-width: 640px) { header::before { right: -380px; top: -460px; } }
  header::after { content: ""; position: absolute; width: 76vw; aspect-ratio: 1; border-radius: 50%;
    left: -34vw; bottom: -46vw; background: rgba(255, 255, 255, .07); }
  .hero { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; max-width: 640px; margin: 0 auto; }
  .hero > div { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; color: rgba(255, 255, 255, .85); font-size: 15px; }
  .glass { width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: rgba(255, 255, 255, .2); border: 1px solid rgba(255, 255, 255, .35); }
  .glass svg { width: 24px; height: 24px; }
  button.glass { appearance: none; padding: 0; cursor: pointer; transition: transform .1s, background .2s; }
  button.glass:active { transform: scale(.92); background: rgba(255, 255, 255, .3); }
  button.glass:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  /* Ayarlar: alttan açılan sayfa */
  dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 640px; max-height: 92dvh;
    background: var(--bg); color: var(--ink); border-radius: 30px 30px 0 0; overflow: auto;
    padding-bottom: env(safe-area-inset-bottom); }
  dialog.sheet[open] { animation: up .28s cubic-bezier(.2, .8, .2, 1); }
  dialog.sheet::backdrop { background: rgba(10, 14, 28, .45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  @keyframes up { from { transform: translateY(100%); } }
  .sheet-head { display: flex; align-items: center; padding: 12px 18px 4px 22px; position: relative; }
  .sheet-head::before { content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 5px; margin-left: -20px;
    border-radius: 3px; background: var(--line); }
  .sheet-head h2 { flex: 1; margin: 14px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .close { appearance: none; border: 0; width: 40px; height: 40px; margin-top: 14px; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; background: var(--field); color: var(--muted); }
  .close svg { width: 18px; height: 18px; }
  .sheet-body { padding: 14px 18px 24px; display: flex; flex-direction: column; gap: 14px; }
  .section-t { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 4px 0 -4px 6px; }
  .about { text-align: center; padding: 26px 20px 20px; }
  .about .logo { width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 24px;
    box-shadow: 0 14px 30px -12px rgba(20, 99, 224, .6); }
  .brand { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .brand span { font-weight: 400; background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  @media (prefers-color-scheme: dark) { .brand span { background-image: linear-gradient(135deg, #8ec0ff, #6fd3a6); } }
  .tagline { margin: 2px 0 18px; color: var(--muted); font-size: 15px; }
  .rows { text-align: left; border-radius: 18px; background: var(--field); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 13px 16px; font-size: 16px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row span:first-child { color: var(--muted); }
  .row span:last-child { font-weight: 600; text-align: right; }
  .about p.desc { margin: 18px 4px 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .copy { margin: 4px 0 0; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .copy b { color: var(--ink); font-weight: 650; }

  main { flex: 1; padding: 20px 18px 150px; display: flex; flex-direction: column; gap: 16px;
    max-width: 640px; width: 100%; margin: 0 auto; }
  .card { background: var(--card); border-radius: var(--card-r); padding: 18px; box-shadow: var(--shadow); }

  /* Kart başlığı: parlak rozet + yazı */
  .step { display: flex; align-items: center; gap: 12px; font-weight: 650; font-size: 18px; margin-bottom: 14px; }
  .step small { color: var(--muted); font-weight: 500; font-size: 15px; }
  .badge { --c: #1463e0; --c1: #4382e6; --c2: #0f4daf; width: 40px; height: 40px; border-radius: 13px; flex: none;
    position: relative; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: 0 4px 10px -3px var(--c); }
  .badge::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(to bottom, rgba(255, 255, 255, .22), transparent 50%); }
  .badge svg { width: 20px; height: 20px; }
  .badge.green { --c: #1e9e6a; --c1: #4cb187; --c2: #177b52; }

  /* Başlıktaki beyaz hap giriş alanı (Çelik Kubbe arama kutusu gibi) */
  .who { position: relative; z-index: 1; max-width: 640px; margin: 22px auto 0; }
  .who label { display: block; font-size: 14px; font-weight: 600; letter-spacing: .02em; color: rgba(255, 255, 255, .85); margin: 0 0 8px 6px; }
  .search { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 999px; padding: 0 8px 0 18px;
    box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .45); border: 2px solid transparent; transition: border-color .2s; }
  .search:focus-within { border-color: rgba(255, 255, 255, .9); box-shadow: 0 0 0 4px rgba(255, 255, 255, .25), 0 10px 24px -12px rgba(0, 0, 0, .45); }
  .search svg { width: 22px; height: 22px; color: #1463e0; flex: none; }
  .search input { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 16px 4px; border: 0; background: none; color: #151823; outline: none; }
  .search input::placeholder { color: #5f6678; opacity: .8; }

  /* Butonlar */
  .actions { display: grid; grid-template-columns: 1.45fr 1fr; gap: 10px; }
  .btn { appearance: none; border: 0; font: inherit; font-weight: 600; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 18px;
    transition: transform .1s, opacity .2s, box-shadow .2s; user-select: none; }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 24px; height: 24px; flex: none; }
  .btn-grad { color: #fff; background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
    box-shadow: 0 10px 22px -10px var(--hero-a); }
  .btn-cam { font-size: 18px; min-height: 64px; }
  .btn-gal { background: var(--primary-soft); color: var(--primary); min-height: 64px; }
  .file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* Fotoğraflar */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .grid:empty::before { content: attr(data-empty); grid-column: 1 / -1; color: var(--muted); font-size: 15px;
    text-align: center; padding: 24px 0; border-radius: 18px; background: var(--field); }
  .ph { position: relative; aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: var(--field);
    animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph .x { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; padding: 0; cursor: pointer;
    display: grid; place-items: center; color: #fff;
    background: rgba(15, 18, 30, .45); border: 1px solid rgba(255, 255, 255, .35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .ph .x svg { width: 14px; height: 14px; }
  .ph .st { position: absolute; inset: 0; display: grid; place-items: center; transition: background .2s; }
  .ph .st::after { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 20px; }
  .ph.sending .st { background: rgba(20, 99, 224, .35); }
  .ph.sending .st::after { content: ""; width: 30px; height: 30px; border: 3px solid rgba(255, 255, 255, .4);
    border-top-color: #fff; animation: spin .8s linear infinite; }
  .ph.done .st { background: rgba(30, 158, 106, .35); }
  .ph.done .st::after { content: "✓"; background: var(--ok); box-shadow: 0 4px 12px -2px rgba(0, 0, 0, .3); }
  .ph.fail .st { background: rgba(220, 38, 38, .3); }
  .ph.fail .st::after { content: "!"; background: var(--err); box-shadow: 0 4px 12px -2px rgba(0, 0, 0, .3); }
  .ph.sending .x, .ph.done .x { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Yapışkan gönder butonu */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 18px calc(env(safe-area-inset-bottom) + 16px);
    background: linear-gradient(to top, var(--bg) 65%, transparent); }
  .bar-in { max-width: 640px; margin: 0 auto; }
  .btn-send { width: 100%; font-size: 19px; min-height: 62px; position: relative; overflow: hidden; }
  .btn-send:disabled { opacity: .45; box-shadow: none; }
  .btn-send .prog { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255, 255, 255, .22); transition: width .3s; }
  .btn-send .lbl { position: relative; display: flex; align-items: center; gap: 10px; }

  /* Bildirim */
  .msg { border-radius: 20px; padding: 14px 16px; font-weight: 600; display: none; align-items: flex-start; gap: 12px; font-size: 16px; }
  .msg.show { display: flex; animation: pop .25s ease-out; }
  .msg::before { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .msg.ok::before { content: "✓"; background: var(--ok); }
  .msg.err { background: var(--err-bg); color: var(--err-ink); }
  .msg.err::before { content: "!"; background: var(--err); }
  .setup { text-align: center; color: var(--muted); }
  .setup b { color: var(--ink); }
  .ph.queued .st { background: rgba(20, 99, 224, .25); }
  .ph.queued .st::after { content: "⏱"; background: var(--primary); font-size: 17px; box-shadow: 0 4px 12px -2px rgba(0, 0, 0, .3); }
  .badge.amber { --c: #d97706; --c1: #f5a524; --c2: #c26a05; }
  .note { display: block; width: 100%; min-height: 96px; resize: vertical; font: inherit; font-size: 16px; line-height: 1.45;
    padding: 14px 16px; border: 2px solid transparent; border-radius: 18px; background: var(--field); color: var(--ink); outline: none; }
  .note:focus { border-color: var(--primary); }
  .msg.info { background: var(--primary-soft); color: var(--primary); }
  .msg.info::before { content: "⏱"; background: var(--primary); font-size: 14px; }

  /* Ayarlar satırları */
  .set { padding: 4px 16px; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; }
  .set-row + .set-row { border-top: 1px solid var(--line); }
  .set-row > span { font-weight: 600; }
  .seg { display: flex; background: var(--field); border-radius: 999px; padding: 4px; }
  .seg button { appearance: none; border: 0; font: inherit; font-size: 15px; font-weight: 600; padding: 8px 14px;
    border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--primary); box-shadow: 0 2px 6px rgba(0, 0, 0, .12); }
  .set-in { flex: 1; min-width: 0; max-width: 230px; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 14px;
    border: 2px solid transparent; background: var(--field); color: var(--ink); outline: none; text-align: right; }
  .set-in:focus { border-color: var(--primary); }
  .btn-soft { width: 100%; background: var(--primary-soft); color: var(--primary); padding: 13px; margin: 8px 0 2px; }
  .btn-soft svg { width: 20px; height: 20px; }
  .conn { min-height: 22px; font-size: 15px; font-weight: 600; text-align: center; padding: 6px 0 10px; color: var(--muted); }
  .conn.ok { color: var(--ok); }
  .conn.err { color: var(--err); }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; font-size: 15px; }
  .hist li + li { border-top: 1px solid var(--line); }
  .hist li > div { min-width: 0; }
  .hist b { display: block; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist small { color: var(--muted); font-size: 14px; }
  /* Gönderildi mesajındaki offerte düğmesi */
  .msg .ob { display: flex; width: fit-content; align-items: center; margin-top: 10px; appearance: none; border: 0; font: inherit;
    font-size: 16px; font-weight: 700; padding: 11px 18px; border-radius: 999px; cursor: pointer; text-decoration: none; color: #fff;
    background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); box-shadow: 0 8px 18px -10px var(--hero-a); }
  .msg a.ob { background: var(--ok); box-shadow: none; }
  .msg .ob:disabled { opacity: .7; }
  .hist .empty { color: var(--muted); justify-content: center; }
  /* Mikrofon: sesle yazma + sesli mesaj */
  .mics { display: flex; gap: 10px; margin-top: 10px; }
  .mics > .btn { flex: 1; }
  .btn.mic { background: var(--primary-soft); color: var(--primary); padding: 12px; font-size: 16px; min-height: 52px; }
  .btn.mic svg { width: 20px; height: 20px; }
  .btn.mic.on { background: var(--err); color: #fff; animation: pulse 1.4s ease-in-out infinite; }
  .btn.mic:disabled { opacity: .4; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, .18); } }
  .voices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .voices:empty { display: none; }
  .voice { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 18px; background: var(--field); animation: pop .25s ease-out; }
  .voice .play { appearance: none; border: 0; width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center;
    cursor: pointer; color: #fff; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); }
  .voice .play svg { width: 18px; height: 18px; }
  .voice .vi { flex: 1; min-width: 0; }
  .voice .vi b { display: block; font-size: 15px; font-weight: 650; }
  .voice .vi small { color: var(--muted); font-size: 14px; }
  .voice .vst { font-size: 17px; font-weight: 800; }
  .voice.queued .vst::after { content: "⏱"; }
  .voice.sending .vst::after { content: ""; display: block; width: 18px; height: 18px; border-radius: 50%;
    border: 3px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .8s linear infinite; }
  .voice.done .vst::after { content: "✓"; color: var(--ok); }
  .voice .x { appearance: none; border: 0; width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
    cursor: pointer; background: none; color: var(--muted); }
  .voice .x svg { width: 14px; height: 14px; }
  .voice.sending .x, .voice.done .x { visibility: hidden; }
</style>
</head>
<body>
<header>
  <div class="hero">
    <div>
      <h1>Foto Gönder</h1>
      <p data-i18n="sub"></p>
    </div>
    <button class="glass" id="openSettings" type="button" data-i18n-aria="settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="who" id="who">
    <label for="customer" data-i18n="customer"></label>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>
      <input id="customer" type="text" list="recent" data-i18n-ph="customerPh"
             autocomplete="off" autocapitalize="words" enterkeyhint="done">
    </div>
    <datalist id="recent"></datalist>
  </div>
</header>

<main id="app">
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div id="setup" class="card setup" data-i18n="notConfigured" hidden></div>

  <section class="card">
    <div class="step">
      <span class="badge green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <span data-i18n="photos"></span> <small id="count"></small>
    </div>
    <div class="actions">
      <label class="btn btn-grad btn-cam" for="cam">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span data-i18n="cam"></span>
      </label>
      <label class="btn btn-gal" for="gal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>
        <span data-i18n="gal"></span>
      </label>
      <input id="cam" class="file" type="file" accept="image/*" capture="environment">
      <input id="gal" class="file" type="file" accept="image/*" multiple>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <section class="card">
    <div class="step">
      <span class="badge amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></span>

<script src="config.js"></script>
<script>
(async () => {
  const MAX_SIDE = 2560;            // Drive'a giden fotoğrafın uzun kenarı; offerte için fazlasıyla yeterli
  const $ = id => document.getElementById(id);
  const scriptUrl = (window.FOTO_CONFIG || {}).scriptUrl;

  // Anahtar kurulum linkinden (?k=…) gelir. iOS ana ekran uygulaması Safari'nin hafızasını paylaşmaz,
  // bu yüzden link adreste kalır ve ayrıca burada saklanır.
  const urlKey = new URLSearchParams(location.search).get('k');
  if (urlKey) localStorage.setItem('key', urlKey);
  const key = urlKey || localStorage.getItem('key');
  const configured = !!(scriptUrl && key);

  // ---------- Dil ----------
  const L = {
    tr: {
      sub: 'Foto çek, gönder. Ofise otomatik gider.', customer: 'Müşteri', customerPh: 'Ad, örn. Jansen – Dorpstraat 12',
      photos: 'Fotoğraflar', cam: 'Foto çek', gal: 'Galeri', empty: 'Henüz foto yok', del: 'Fotoğrafı sil',
      noteT: 'Not', optional: '(isteğe bağlı)', notePh: 'Ölçüler, yapılacak işler… örn. Mutfak 3,20 × 4,10 m, eski fayans sökülecek',
      send: 'Gönder', sendN: 'Gönder ({p})', sendNote: 'Notu gönder', retryN: 'Tekrar gönder ({n})', sending: 'Gönderiliyor… {i}/{n}',
      needCustomer: 'Önce müşteri adını yazın.', sentOk: '"{c}" klasörüne gönderildi: {what}.',
      offline: 'İnternet yok. {n} öğe telefonda saklanıyor, internet gelince kendiliğinden gönderilecek.',
      failed: '{sent} gönderildi, {failed} gönderilemedi ({err}). Telefonda saklanıyor; tekrar denenecek.',
      badImg: 'Bu fotoğraf açılamadı.',
      notConfigured: '<b>Uygulama henüz kurulmamış.</b><br>Size gönderilen kurulum linkini açın.',
      settings: 'Ayarlar', close: 'Kapat', general: 'Genel', language: 'Dil', yourName: 'Adınız', namePh: 'örn. Ahmet',
      connection: 'Bağlantı', pending: 'Telefonda bekleyen', check: 'Bağlantıyı kontrol et', checking: 'Kontrol ediliyor…',
      connOk: '✓ Bağlantı çalışıyor', connBadKey: 'Anahtar geçersiz. Kurulum linkini yeniden açın.', connOffline: 'İnternet yok veya sunucuya ulaşılamıyor.',
      history: 'Geçmiş', historyEmpty: 'Henüz gönderim yok.', photo1: '1 foto', photosN: '{n} foto', withNote: 'not',
      makeOfferte: '📄 Offerte hazırla', making: 'Hazırlanıyor…', openOfferte: 'Offerteyi aç ↗',
      dictate: 'Sesle yaz', listening: 'Dinliyorum… bitir', record: 'Sesli mesaj', recording: 'Kayıt {t} · bitir',
      voice: 'Sesli mesaj', voice1: '1 sesli mesaj', voiceN: '{n} sesli mesaj', voiceFile: 'Sesli-mesaj', play: 'Dinle',
      micDenied: 'Mikrofon izni yok. Telefon ayarlarından bu uygulamaya mikrofon izni verin.',
      noteFile: 'Not', dateL: 'Tarih', byL: 'Gönderen',
      about: 'Hakkında', tagline: 'Akıllı yazılım, sade çözümler.', app: 'Uygulama', version: 'Sürüm', developer: 'Geliştirici',
      desc: 'Foto Gönder, sahada çekilen fotoğrafları tek dokunuşla ofise ulaştırmak için CintraSoft tarafından tasarlandı ve geliştirildi.',
      copy: '© {y} <b>CintraSoft</b>. Tüm hakları saklıdır.<br>İzinsiz kopyalanamaz, çoğaltılamaz ve dağıtılamaz.',
    },
    nl: {
      sub: 'Maak foto\'s, verstuur. Ze komen vanzelf op kantoor.', customer: 'Klant', customerPh: 'Naam, bijv. Jansen – Dorpstraat 12',
      photos: 'Foto\'s', cam: 'Foto maken', gal: 'Galerij', empty: 'Nog geen foto\'s', del: 'Foto verwijderen',
      noteT: 'Notitie', optional: '(optioneel)', notePh: 'Maten, werkzaamheden… bijv. Keuken 3,20 × 4,10 m, oude tegels eruit',
      send: 'Versturen', sendN: 'Versturen ({p})', sendNote: 'Notitie versturen', retryN: 'Opnieuw versturen ({n})', sending: 'Versturen… {i}/{n}',
      needCustomer: 'Vul eerst de klantnaam in.', sentOk: 'Verstuurd naar map "{c}": {what}.',
      offline: 'Geen internet. {n} items blijven op de telefoon en gaan vanzelf zodra er internet is.',
      failed: '{sent} verstuurd, {failed} mislukt ({err}). Ze blijven op de telefoon; we proberen het opnieuw.',
      badImg: 'Deze foto kan niet worden geopend.',
      notConfigured: '<b>De app is nog niet ingesteld.</b><br>Open de installatielink die u heeft ontvangen.',
      settings: 'Instellingen', close: 'Sluiten', general: 'Algemeen', language: 'Taal', yourName: 'Uw naam', namePh: 'bijv. Ahmet',
      connection: 'Verbinding', pending: 'Wacht op de telefoon', check: 'Verbinding controleren', checking: 'Bezig met controleren…',
      connOk: '✓ Verbinding werkt', connBadKey: 'Sleutel ongeldig. Open de installatielink opnieuw.', connOffline: 'Geen internet of server onbereikbaar.',
      history: 'Geschiedenis', historyEmpty: 'Nog niets verstuurd.', photo1: '1 foto', photosN: '{n} foto\'s', withNote: 'notitie',
      makeOfferte: '📄 Offerte maken', making: 'Bezig…', openOfferte: 'Open offerte ↗',
      dictate: 'Dicteren', listening: 'Luisteren… stop', record: 'Spraakbericht', recording: 'Opname {t} · stop',
      voice: 'Spraakbericht', voice1: '1 spraakbericht', voiceN: '{n} spraakberichten', voiceFile: 'Spraakbericht', play: 'Afspelen',
      micDenied: 'Geen toegang tot de microfoon. Sta dit toe in de instellingen van de telefoon.',
      noteFile: 'Notitie', dateL: 'Datum', byL: 'Verstuurd door',
      about: 'Over', tagline: 'Slimme software, eenvoudige oplossingen.', app: 'App', version: 'Versie', developer: 'Ontwikkelaar',
      desc: 'Foto Gönder is ontworpen en ontwikkeld door CintraSoft om foto\'s van de bouwplaats met één tik op kantoor te krijgen.',
      copy: '© {y} <b>CintraSoft</b>. Alle rechten voorbehouden.<br>Niets mag zonder toestemming worden gekopieerd, verveelvoudigd of verspreid.',
    },
  };
  let lang = localStorage.getItem('lang') || (/^nl/i.test(navigator.language) ? 'nl' : 'tr');
  const year = Math.max(2026, new Date().getFullYear());
  const t = (k, v = {}) => L[lang][k].replace(/\{(\w+)\}/g, (_, n) => v[n]);
  const pn = n => n === 1 ? t('photo1') : t('photosN', { n });
  const vn = n => n === 1 ? t('voice1') : t('voiceN', { n });
  const summary = (p, a, note) => [p ? pn(p) : '', a ? vn(a) : '', note ? t('withNote') : ''].filter(Boolean).join(' + ');

  // ---------- Telefonda saklama (IndexedDB) ----------
  // Fotoğraflar küçültülüp hemen kaydedilir; uygulama kapansa da, internet olmasa da kaybolmaz.
  let db = null;
  try {
    db = await new Promise((ok, no) => {
      const r = indexedDB.open('fotogonder', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'id' });
      r.onsuccess = () => ok(r.result);
      r.onerror = () => no(r.error);
    });
  } catch { /* gizli sekme vb.: yalnızca bellekte çalışır */ }
  const req = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  const store = mode => db.transaction('q', mode).objectStore('q');
  const dbPut = it => db ? req(store('readwrite').put({ id: it.id, kind: it.kind, blob: it.blob,
    dur: it.dur, customer: it.customer, date: it.date, fileName: it.fileName })) : Promise.resolve();
  const dbDel = id => db ? req(store('readwrite').delete(id)) : Promise.resolve();
  const dbAll = () => db ? req(store('readonly').getAll()) : Promise.resolve([]);

  const items = []; // { id, kind: 'photo'|'audio'|'note', blob, dur, customer, date, fileName, state, url, el }
  let busy = false;

  const z = n => String(n).padStart(2, '0');
  const today = (d = new Date()) => `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
  const stamp = (d = new Date()) => `${today(d)}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
  const fileSafe = s => String(s || '').trim().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 30);
  const worker = () => localStorage.getItem('worker') || '';
  const fmtDur = s => `${Math.floor(s / 60)}:${z(s % 60)}`;
  const AUDIO_EXT = { 'audio/mp4': 'm4a', 'audio/webm': 'webm', 'audio/ogg': 'ogg', 'audio/mpeg': 'mp3', 'audio/aac': 'aac' };

  function show(text, kind) {
    const m = $('msg');
    m.textContent = text;
    m.className = 'msg show ' + kind;
    if (kind === 'ok') setTimeout(() => m.className === 'msg show ok' && (m.className = 'msg'), 6000);
  }

  // ---------- Ekran ----------
  function applyLang() {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll('[data-i18n]')) el.innerHTML = t(el.dataset.i18n, { y: year });
    for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);
    for (const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', t(el.dataset.i18nAria));
    for (const b of $('langSeg').children) b.setAttribute('aria-pressed', b.dataset.lang === lang);
    $('grid').dataset.empty = t('empty');
    $('conn').textContent = '';
    renderHistory(); items.forEach(paint); refresh();
  }

  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
  function render(it) {
    it.url = URL.createObjectURL(it.blob);
    it.el = document.createElement('div');
    const x = `<button class="x" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
    if (it.kind === 'audio') {
      it.el.innerHTML = `<button class="play" type="button">${PLAY}</button><div class="vi"><b></b><small></small></div><span class="vst"></span>${x}<audio preload="none" src="${it.url}"></audio>`;
      const a = it.el.querySelector('audio'), pb = it.el.querySelector('.play');
      pb.onclick = () => a.paused ? a.play() : a.pause();
      a.onplay = () => { pb.innerHTML = PAUSE; };
      a.onpause = a.onended = () => { pb.innerHTML = PLAY; };
    } else {
      it.el.innerHTML = `<img src="${it.url}" alt=""><span class="st"></span>${x}`;
    }
    it.el.querySelector('.x').onclick = async () => {
      if (busy) return;
      await dbDel(it.id);
      drop(it);
      refresh();
    };
    paint(it);
    $(it.kind === 'audio' ? 'voices' : 'grid').append(it.el);
  }

  function paint(it) {
    if (!it.el) return; // notların küçük resmi yok
    it.el.querySelector('.x').setAttribute('aria-label', t('del'));
    if (it.kind === 'audio') {
      it.el.className = 'voice ' + (it.state || '');
      it.el.querySelector('b').textContent = t('voice');
      it.el.querySelector('small').textContent = fmtDur(it.dur || 0);
      it.el.querySelector('.play').setAttribute('aria-label', t('play'));
      return;
    }
    it.el.className = 'ph ' + (it.state || '');
  }

  function drop(it) {
    if (it.url) URL.revokeObjectURL(it.url);
    if (it.el) it.el.remove();
    items.splice(items.indexOf(it), 1);
  }

  function refresh() {
    const fresh = items.filter(i => !i.customer).length;               // henüz Gönder'e basılmamış foto/ses
    const freshA = items.filter(i => !i.customer && i.kind === 'audio').length;
    const waiting = items.filter(i => i.customer && i.state !== 'done').length; // kuyrukta bekleyenler
    const hasNote = $('note').value.trim() !== '';
    const shown = items.filter(i => i.kind === 'photo').length;
    $('count').textContent = shown ? `(${shown})` : '';
    $('pendingCount').textContent = fresh + waiting;
    $('send').disabled = busy || !(fresh || waiting || hasNote);
    if (!busy) $('sendLbl').textContent = fresh ? t('sendN', { p: summary(fresh - freshA, freshA) }) : waiting ? t('retryN', { n: waiting })
      : hasNote ? t('sendNote') : t('send');
  }

  function renderHistory() {
    const h = JSON.parse(localStorage.getItem('history') || '[]');
    const fmt = new Intl.DateTimeFormat(lang === 'nl' ? 'nl-NL' : 'tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    $('hist').replaceChildren(...(h.length ? h.map(e => {
      const li = document.createElement('li');
      li.innerHTML = '<div><b></b><small></small></div>';
      li.querySelector('b').textContent = e.c;
      li.querySelector('small').textContent = [summary(e.p, e.a, e.note), fmt.format(new Date(e.at))].filter(Boolean).join(' · ');
      return li;
    }) : [Object.assign(document.createElement('li'), { className: 'empty', textContent: t('historyEmpty') })]));
  }

  // Gönderildi mesajı + tek düğmeyle offerte: Google o ziyaretin gün klasöründen bir Google Docs taslağı yapar.
  function showSent(text, c, d) {
    const m = $('msg'), box = document.createElement('div');
    const b = Object.assign(document.createElement('button'), { className: 'ob', type: 'button', textContent: t('makeOfferte') });
    b.onclick = async () => {
      b.disabled = true; b.textContent = t('making');
      try {
        const out = await post({ key, action: 'offerte', customer: c, date: d });
        if (!out.ok) throw new Error(out.error);
        b.replaceWith(Object.assign(document.createElement('a'), { className: 'ob', href: out.url, target: '_blank', rel: 'noopener', textContent: t('openOfferte') }));
      } catch (err) {
        b.disabled = false; b.textContent = t('makeOfferte');
        box.firstChild.textContent = navigator.onLine ? String(err.message || err) : t('connOffline');
      }
    };
    box.append(document.createElement('span'), b);
    box.firstChild.textContent = text;
    m.replaceChildren(box);
    m.className = 'msg show ok'; // kendiliğinden kapanmaz; bir sonraki gönderime kadar durur
    m.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ---------- Ayarlar ----------
  const sheet = $('settings');
  $('openSettings').onclick = () => { renderHistory(); refresh(); sheet.showModal(); };
  $('closeSettings').onclick = () => sheet.close();
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); }); // boşluğa dokununca kapan
  for (const b of $('langSeg').children) b.onclick = () => { lang = b.dataset.lang; localStorage.setItem('lang', lang); $('msg').className = 'msg'; applyLang(); };
  $('worker').value = worker();
  $('worker').addEventListener('input', e => localStorage.setItem('worker', e.target.value.trim()));

  async function post(body) {
    // text/plain: tarayıcı ön kontrol (CORS preflight) yapmaz, Apps Script bunu kabul eder.
    const res = await fetch(scriptUrl, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
    return res.json();
  }

  $('ping').onclick = async () => {
    const c = $('conn');
    c.className = 'conn'; c.textContent = t('checking');
    try {
      const out = await post({ key, ping: true });
      c.className = 'conn ' + (out.ok ? 'ok' : 'err');
      c.textContent = out.ok ? t('connOk') : /anahtar/i.test(out.error || '') ? t('connBadKey') : out.error;
    } catch { c.className = 'conn err'; c.textContent = t('connOffline'); }
  };

  applyLang();

  if (!configured) {
    $('setup').hidden = false;
    for (const s of $('app').querySelectorAll('section')) s.hidden = true;
    $('who').hidden = true;
    $('bar').hidden = true;
    return;
  }

  // ---------- Fotoğraf ekleme ----------
  // Son müşteriler: aynı isim farklı yazılıp iki klasör açılmasın diye öneri olarak çıkar.
  const recent = JSON.parse(localStorage.getItem('recent') || '[]');
  $('recent').innerHTML = recent.map(n => `<option value="${n.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}">`).join('');
  $('customer').value = localStorage.getItem('lastCustomer') || '';
  $('note').value = localStorage.getItem('noteDraft') || '';
  $('note').addEventListener('input', e => { localStorage.setItem('noteDraft', e.target.value); refresh(); });

  // iPhone fotoğrafları 4–12 MB; küçültüp JPEG yaparak hem telefonda az yer kaplar hem hızlı gider.
  async function toJpeg(file) {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    try { await img.decode(); } finally { URL.revokeObjectURL(img.src); }
    const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale);
    c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
    c.width = c.height = 0; // iOS Safari'de canvas belleğini hemen bırak
    if (!blob) throw new Error('jpeg');
    return blob;
  }

  async function add(files) {
    for (const file of files) {
      let blob;
      try { blob = await toJpeg(file); } catch { show(t('badImg'), 'err'); continue; }
      const it = { id: newId(), kind: 'photo', blob, customer: null, date: null, fileName: null, state: '' };
      items.push(it);
      render(it);
      refresh();
      await dbPut(it);
    }
  }
  for (const id of ['cam', 'gal']) {
    $(id).addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; add(f); });
  }

  // ---------- Mikrofon ----------
  // Sesle yazma: Web Speech API (Android Chrome'da var; iPhone ana ekran uygulamasında çoğu zaman yok → düğme gizlenir,
  // orada klavyedeki 🎤 aynı işi görür). Sesli mesaj: MediaRecorder (iPhone + Android).
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const MAX_REC = 300; // 5 dk ≈ 2,5 MB; Apps Script istek sınırının çok altında kalır
  let dict = null, recorder = null;
  $('dictate').hidden = !SR;
  $('record').hidden = !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  function micUI() {
    $('dictate').classList.toggle('on', !!dict);
    $('record').classList.toggle('on', !!recorder);
    $('dictate').disabled = !!recorder;
    $('record').disabled = !!dict;
    $('dictLbl').textContent = t(dict ? 'listening' : 'dictate');
    if (!recorder) $('recLbl').textContent = t('record');
  }

  $('dictate').onclick = () => {
    if (dict) { dict.stop(); return; }
    const r = new SR();
    r.lang = lang === 'nl' ? 'nl-NL' : 'tr-TR';
    r.continuous = true;
    r.interimResults = true;
    const before = $('note').value.replace(/\s+$/, '');
    r.onresult = e => {
      const said = [...e.results].map(x => x[0].transcript.trim()).join(' ');
      $('note').value = (before ? before + ' ' : '') + said;
      localStorage.setItem('noteDraft', $('note').value);
      refresh();
    };
    r.onerror = e => { if (/not-allowed/.test(e.error)) show(t('micDenied'), 'err'); };
    r.onend = () => { dict = null; micUI(); };
    dict = r; micUI();
    try { r.start(); } catch { dict = null; micUI(); }
  };

  $('record').onclick = async () => {
    if (recorder) { recorder.stop(); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { show(t('micDenied'), 'err'); return; }
    // iPhone audio/mp4 (m4a) kaydeder, Android çoğunlukla webm; ikisi de ofiste açılır.
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg']
      .find(x => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x));
    const rec = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: 64000 }, type && { mimeType: type }));
    const chunks = [], t0 = Date.now();
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    const tick = setInterval(() => {
      const sec = Math.floor((Date.now() - t0) / 1000);
      $('recLbl').textContent = t('recording', { t: fmtDur(sec) });
      if (sec >= MAX_REC && rec.state === 'recording') rec.stop();
    }, 250);
    rec.onstop = async () => {
      clearInterval(tick);
      stream.getTracks().forEach(tr => tr.stop());
      recorder = null; micUI();
      const dur = Math.round((Date.now() - t0) / 1000);
      const blob = new Blob(chunks, { type: (rec.mimeType || type || 'audio/webm').split(';')[0] });
      if (!blob.size || dur < 1) return;
      const it = { id: newId(), kind: 'audio', blob, dur, customer: null, date: null, fileName: null, state: '' };
      items.push(it);
      render(it);
      refresh();
      await dbPut(it);
    };
    rec.start(1000);
    recorder = rec; micUI();
    $('recLbl').textContent = t('recording', { t: '0:00' });
  };
  // Uygulamadan çıkılırsa kaydı bitir ve sakla (arka planda mikrofon zaten kesilir).
  document.addEventListener('visibilitychange', () => { if (document.hidden && recorder) recorder.stop(); });

  // ---------- Gönderme ----------
  const b64 = blob => new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok(r.result.slice(r.result.indexOf(',') + 1));
    r.onerror = () => no(r.error);
    r.readAsDataURL(blob);
  });

  async function upload(it) {
    const body = { key, customer: it.customer, date: it.date, fileName: it.fileName,
      mimeType: it.blob.type.split(';')[0] || 'image/jpeg', data: await b64(it.blob) };
    let last;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const out = await post(body);
        if (out.ok) return;
        last = new Error(out.error || '?');
        if (/anahtar/i.test(last.message)) break; // tekrar denemek işe yaramaz
      } catch (e) { last = e; if (!navigator.onLine) break; }
      await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
    }
    throw last;
  }

  $('send').onclick = async () => {
    const customer = $('customer').value.replace(/\s+/g, ' ').trim();
    const fresh = items.filter(i => !i.customer);
    const text = $('note').value.trim();
    if (fresh.length || text) {
      if (!customer) { show(t('needCustomer'), 'err'); $('customer').focus(); return; }
      // Gönder'e basıldığı an fotoğraflar bu müşteriye/güne bağlanır; internet sonra gelse de doğru klasöre gider.
      const date = today(), st = stamp(), who = fileSafe(worker());
      let np = 0, na = 0;
      for (const it of fresh) {
        const audio = it.kind === 'audio';
        const first = audio ? t('voiceFile') : '';
        const ext = audio ? AUDIO_EXT[it.blob.type] || 'webm' : 'jpg';
        Object.assign(it, { customer, date, state: 'queued',
          fileName: [first, st, who, audio ? ++na : ++np].filter(Boolean).join('_') + '.' + ext });
      }
      if (text) {
        const head = `${t('customer')}: ${customer}\n${t('dateL')}: ${date}` + (worker() ? `\n${t('byL')}: ${worker()}` : '');
        items.push({ id: newId(), kind: 'note', blob: new Blob([`${head}\n\n${text}\n`], { type: 'text/plain' }),
          customer, date, state: 'queued', fileName: [t('noteFile'), st, who].filter(Boolean).join('_') + '.txt' });
      }
      await Promise.all(items.filter(i => i.state === 'queued').map(dbPut));
      fresh.forEach(paint);
      $('note').value = ''; localStorage.removeItem('noteDraft');
      localStorage.setItem('lastCustomer', customer);
      const r = [customer, ...JSON.parse(localStorage.getItem('recent') || '[]').filter(n => n.toLowerCase() !== customer.toLowerCase())].slice(0, 30);
      localStorage.setItem('recent', JSON.stringify(r));
    }
    drain(true);
  };

  async function drain(manual) {
    if (busy) return;
    const todo = items.filter(i => i.customer && i.state !== 'done');
    if (!todo.length || (!manual && !navigator.onLine)) { refresh(); return; }
    busy = true; refresh();
    $('msg').className = 'msg';
    let sent = 0, failed = 0, lastErr;
    const log = new Map(); // müşteri|gün → { c, d, p, a, note }
    for (const [n, it] of todo.entries()) {
      if (!navigator.onLine) break; // kalanlar telefonda bekler
      it.state = 'sending'; paint(it);
      $('sendLbl').textContent = t('sending', { i: n + 1, n: todo.length });
      try {
        await upload(it);
        it.state = 'done'; sent++;
        await dbDel(it.id);
        const k = it.customer + '|' + it.date;
        const e = log.get(k) || { c: it.customer, d: it.date, p: 0, a: 0, note: false };
        if (it.kind === 'note') e.note = true; else if (it.kind === 'audio') e.a++; else e.p++;
        log.set(k, e);
      } catch (e) { it.state = 'fail'; failed++; lastErr = e; }
      paint(it);
      $('prog').style.width = `${((n + 1) / todo.length) * 100}%`;
    }
    busy = false;
    $('prog').style.width = '0';
    for (const it of todo) if (it.state === 'fail' || it.state === 'sending') { it.state = 'queued'; paint(it); }

    if (log.size) {
      const h = [...[...log.values()].map(e => ({ ...e, at: Date.now() })), ...JSON.parse(localStorage.getItem('history') || '[]')].slice(0, 30);
      localStorage.setItem('history', JSON.stringify(h));
      renderHistory();
    }
    const left = items.filter(i => i.customer && i.state !== 'done').length;
    if (left && !navigator.onLine) show(t('offline', { n: left }), 'info');
    else if (failed) show(t('failed', { sent, failed, err: lastErr && lastErr.message }), 'err');
    else if (sent) {
      const e = [...log.values()];
      const what = summary(e.reduce((s, x) => s + x.p, 0), e.reduce((s, x) => s + (x.a || 0), 0), e.some(x => x.note));
      const last = e[e.length - 1];
      showSent(t('sentOk', { c: [...new Set(e.map(x => x.c))].join(', '), what }), last.c, last.d);
    }
    setTimeout(() => { for (const it of items.filter(i => i.state === 'done')) drop(it); refresh(); }, 1500);
    refresh();
  }

  // Telefonda kalanları geri yükle; internet gelince / uygulama öne gelince kendiliğinden gönder.
  for (const it of (await dbAll()).sort((a, b) => a.id < b.id ? -1 : 1)) {
    it.state = it.customer ? 'queued' : '';
    items.push(it);
    if (it.kind !== 'note') render(it);
  }
  addEventListener('online', () => drain());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) drain(); });
  if (!db) addEventListener('beforeunload', e => { if (items.some(i => i.state !== 'done')) e.preventDefault(); });
  refresh();
  drain();
})();
</script>
</body>
</html>
