<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf3f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a110d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Foto Gönder">
<title>Foto Gönder</title>
<link rel="manifest" href="manifest.webmanifest?v=319">
<link rel="icon" href="favicon.png?v=317" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png?v=317">
<style>
  /* Kırmızı → turuncu palet: sıcak açık zemin, beyaz çerçeveli kutular, geçiş yalnız müşteri ve şirket kartında. */
  :root {
    --bg: #fbf3f3; --card: #ffffff; --field: #fbf4f4; --ink: #22080a; --muted: #806062; --line: #efd2d3;
    --red: #d4000f; --red-light: #ff2a2a; --red-dark: #8e000b; /* ana renk: parlak kırmızı → bordo */
    --navy: #0d2140; --navy-light: #2a4a75; --navy-dark: #081630; --grey: #9aa9bd; --green: #22c55e;
    --primary: #c8000f; --primary-soft: #ffe1e2; --link: #c8000f;
    --ok: #16a34a; --ok-bg: #e7f8ee; --ok-ink: #14532d;
    --err: #e5484d; --err-bg: #fdecea; --err-ink: #7f1d1d;
    --tint: 200, 0, 15;
    --shadow: 0 1px 2px rgba(42, 22, 16, .06), 0 10px 20px -12px rgba(240, 68, 31, .35);
    --g-navy: linear-gradient(180deg, var(--navy-light), var(--navy-dark));
    --g-red: linear-gradient(180deg, var(--red-light), var(--red) 55%, var(--red-dark)); /* mavi düğmeler */
    --g-main: linear-gradient(135deg, #ff2a2a 0%, #c8000f 50%, #6e0008 100%);      /* kırmızı → bordo */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a110d; --card: #261914; --field: #33221b; --ink: #fff0e8; --muted: #b39a8e; --line: #45312a;
      --primary: #ff8a5c; --primary-soft: #40231a; --link: #ffad5c; --ok-bg: #12382a; --ok-ink: #9be3c1; --err-bg: #3a1d1c; --err-ink: #ffc9cb;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; }
  svg { display: block; }
  [hidden] { display: none !important; } /* display veren sınıflar hidden'ı ezmesin */
  button, label { font: inherit; }
  .file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(229, 72, 77, .18); } }

  /* Üst satır */
  .topbar { display: flex; align-items: center; gap: 12px; max-width: 640px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 16px) 20px 4px; }
  .avatar { width: 46px; height: 46px; border-radius: 15px; flex: none; display: grid; place-items: center; overflow: hidden;
    color: #fff; font-weight: 800; font-size: 16px; background: var(--g-main); }
  .avatar.logo { background: #fff; width: auto; min-width: 46px; max-width: 120px; padding: 4px 8px; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .avatar img { width: auto; max-width: 100%; height: 100%; object-fit: contain; }
  .avatar svg { width: 22px; height: 22px; }
  .hello { flex: 1; min-width: 0; }
  .hello small { display: block; color: var(--muted); font-size: 13px; }
  .hello b { color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 16px; line-height: 1.2; overflow: hidden; }
  .icon-btn { appearance: none; border: 0; width: 44px; height: 44px; border-radius: 14px; flex: none; cursor: pointer;
    display: grid; place-items: center; background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .icon-btn svg { width: 21px; height: 21px; }

  main { max-width: 640px; margin: 0 auto; padding: 14px 20px 200px; display: flex; flex-direction: column; }
  main > * + * { margin-top: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 10px; }
  .sec b { font-size: 16px; }
  .sec small { color: var(--muted); font-size: 13px; }
  .link { appearance: none; border: 0; background: none; padding: 0; color: var(--link); font-weight: 650; font-size: 14px; cursor: pointer; }

  /* İki parçalı seçici */
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; box-shadow: var(--shadow); }
  .seg button { appearance: none; border: 0; flex: 1; padding: 10px 8px; border-radius: 11px; background: none; cursor: pointer;
    font-weight: 650; font-size: 15px; color: var(--muted); transition: background .2s, color .2s; }
  .seg button[aria-pressed="true"] { background: var(--g-red); color: #fff; box-shadow: 0 4px 10px -6px rgba(var(--tint), .8); }

  /* Müşteri kartı: beyaz ve çerçeveli; solda ince kırmızı şerit */
  .hero { border-radius: 22px; padding: 16px; color: #fff; background: var(--g-main); position: relative; overflow: hidden;
    box-shadow: 0 14px 26px -16px rgba(var(--tint), .7); }
  .hero::after { content: ""; position: absolute; right: -50px; top: -70px; width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255, 255, 255, .12); pointer-events: none; }
  .hero > * { position: relative; z-index: 1; }
  .hero label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .9); margin: 0 0 8px 2px; }
  .pill { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 0 14px; border: 2px solid transparent; }
  .pill:focus-within { border-color: #ffd0b5; }
  .pill svg { width: 20px; height: 20px; color: var(--red); flex: none; }
  .pill input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; font-size: 17px; font-weight: 600;
    color: #2a1610; padding: 13px 0; }
  .pill input::placeholder { color: #b3968b; font-weight: 500; }
  .stats { display: flex; gap: 8px; margin-top: 12px; }
  .stat { flex: 1; background: rgba(255, 255, 255, .2); border: 1px solid rgba(255, 255, 255, .45); border-radius: 12px; padding: 9px 12px; }
  .stat small { display: block; font-size: 11.5px; color: rgba(255, 255, 255, .88); }
  .stat b { font-size: 17px; }

  /* Fotoğraflar */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .grid:empty::before { content: attr(data-empty); grid-column: 1 / -1; color: var(--muted); font-size: 14px;
    text-align: center; padding: 22px 0; border-radius: 16px; background: var(--field); }
  .ph { position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--field); animation: pop .25s ease-out; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph .x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; padding: 0; cursor: pointer;
    display: grid; place-items: center; color: #fff; background: rgba(15, 18, 30, .45); border: 1px solid rgba(255, 255, 255, .35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .ph .x svg { width: 13px; height: 13px; }
  .ph .st { position: absolute; inset: 0; display: grid; place-items: center; transition: background .2s; }
  .ph .st::after { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; }
  .ph.sending .st { background: rgba(var(--tint), .4); }
  .ph.sending .st::after { content: ""; width: 28px; height: 28px; border: 3px solid rgba(255, 255, 255, .4); border-top-color: #fff; animation: spin .8s linear infinite; }
  .ph.done .st { background: rgba(31, 191, 117, .3); }
  .ph.done .st::after { content: "✓"; background: var(--green); }
  .ph.fail .st { background: rgba(229, 72, 77, .3); }
  .ph.fail .st::after { content: "!"; background: var(--err); }
  .ph.queued .st { background: rgba(var(--tint), .3); }
  .ph.queued .st::after { content: "⏱"; background: var(--navy); font-size: 16px; }
  .ph.sending .x, .ph.done .x { display: none; }

  /* Not + mikrofon */
  .note { display: block; width: 100%; min-height: 84px; resize: vertical; font: inherit; font-size: 16px; line-height: 1.45;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--field); color: var(--ink); outline: none; }
  .note:focus { border-color: var(--primary); }
  .mics { display: flex; gap: 8px; margin-top: 10px; }
  .mic { appearance: none; border: 0; flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px;
    border-radius: 14px; font-weight: 650; font-size: 14px; cursor: pointer; }
  .mic svg { width: 18px; height: 18px; }
  #dictate { background: var(--primary-soft); color: var(--primary); }
  #record { background: #ffe8d1; color: #c25a00; }
  @media (prefers-color-scheme: dark) { #record { background: #12382a; color: #6fd99f; } }
  .mic.on { background: var(--err) !important; color: #fff !important; animation: pulse 1.4s ease-in-out infinite; }
  .mic:disabled { opacity: .4; }
  .voices { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .voices:empty { display: none; }
  .voice { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 16px; background: var(--field); animation: pop .25s ease-out; }
  .voice .play { appearance: none; border: 0; width: 40px; height: 40px; border-radius: 13px; flex: none; display: grid; place-items: center;
    cursor: pointer; color: #fff; background: var(--navy); }
  .voice .play svg { width: 17px; height: 17px; }
  .voice .vi { flex: 1; min-width: 0; }
  .voice .vi b { display: block; font-size: 14.5px; }
  .voice .vi small { color: var(--muted); font-size: 13px; }
  .voice .vst { font-size: 16px; font-weight: 800; }
  .voice.queued .vst::after { content: "⏱"; }
  .voice.sending .vst::after { content: ""; display: block; width: 18px; height: 18px; border-radius: 50%;
    border: 3px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .8s linear infinite; }
  .voice.done .vst::after { content: "✓"; color: var(--ok); }
  .voice .x { appearance: none; border: 0; width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center;
    cursor: pointer; background: none; color: var(--muted); }
  .voice .x svg { width: 13px; height: 13px; }
  .voice.sending .x, .voice.done .x { visibility: hidden; }

  /* Form alanları */
  .fields { display: grid; gap: 10px; }
  .f { display: grid; gap: 5px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
  .f span { margin-left: 4px; }
  .f input { width: 100%; font: inherit; font-size: 16px; font-weight: 400; color: var(--ink); padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--field); outline: none; }
  .f input:focus { border-color: var(--primary); background: var(--card); }

  /* Renkli kare simgeli liste (son gönderimler / geçmiş) */
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { display: flex; align-items: center; gap: 12px; padding: 9px 2px; }
  .hist li + li { border-top: 1px solid var(--line); }
  .hist .t { flex: 1; min-width: 0; }
  .hist b { display: block; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist small { color: var(--muted); font-size: 12.5px; }
  .hist .r { text-align: right; font-size: 12.5px; color: var(--muted); flex: none; }
  .hist .r b { color: var(--green); font-size: 13px; }
  .hist .empty { color: var(--muted); justify-content: center; font-size: 14px; }
  .hist .hx { appearance: none; border: 0; background: none; width: 34px; height: 34px; border-radius: 50%; flex: none;
    display: grid; place-items: center; color: var(--muted); cursor: pointer; }
  .hist .hx svg { width: 13px; height: 13px; }
  .sq { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: #fff; flex: none; }
  .sq svg { width: 19px; height: 19px; }
  .c0 { background: linear-gradient(180deg, #ff2a2a, #b0000d); color: #fff; }
  .c1 { background: linear-gradient(180deg, #5a5560, #2a2630); color: #fff; }
  .c2 { background: linear-gradient(180deg, #f25c54, #c81e2a); color: #fff; }
  .c3 { background: linear-gradient(180deg, #e2453b, #8e000b); color: #fff; }
  .c4 { background: linear-gradient(180deg, #e2453b, #9e1520); color: #fff; }
  .c5 { background: linear-gradient(180deg, #22c55e, #0f8f3f); color: #fff; }
  @media (prefers-color-scheme: dark) {
    #record { background: #3a2412; color: #ffb36b; }
  }

  /* Bildirim (yeşil/kırmızı/mavi şerit) */
  .msg { border-radius: 18px; padding: 12px; font-weight: 600; display: none; align-items: center; gap: 12px; font-size: 14.5px; }
  .msg.show { display: flex; animation: pop .25s ease-out; }
  .msg::before { width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 17px; }
  .msg > div { flex: 1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .msg > div span { flex: 1; min-width: 150px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .msg.ok::before { content: "✓"; background: linear-gradient(135deg, #4fd99a, var(--green)); }
  .msg.err { background: var(--err-bg); color: var(--err-ink); }
  .msg.err::before { content: "!"; background: var(--err); }
  .msg.info { background: var(--primary-soft); color: var(--primary); }
  .msg.info::before { content: "⏱"; background: var(--red); font-size: 15px; }
  .msg .ob { padding: 9px 14px; border-radius: 12px; color: #fff; background: var(--green); font-weight: 700; font-size: 14px; text-decoration: none; white-space: nowrap; }
  /* Ana ekrana ekle kartı */
  .inst { display: flex; align-items: center; gap: 12px; }
  .inst .t { flex: 1; min-width: 0; }
  .inst .t b { display: block; font-size: 15px; }
  .inst .t small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 2px; }
  .inst .go { appearance: none; border: 0; flex: none; padding: 10px 14px; border-radius: 12px; cursor: pointer; color: #fff;
    background: var(--g-red); font-weight: 700; font-size: 14px; }
  .inst .hx { appearance: none; border: 0; background: none; width: 30px; height: 30px; flex: none; display: grid; place-items: center;
    color: var(--muted); cursor: pointer; align-self: flex-start; }
  .inst .hx svg { width: 12px; height: 12px; }
  .setup { text-align: center; color: var(--muted); }
  .setup b { color: var(--ink); }

  /* Alt: Gönder + menü */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; }
  .bar::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 190px; pointer-events: none;
    background: linear-gradient(to top, var(--bg) 62%, transparent); }
  .bar-in { position: relative; max-width: 640px; margin: 0 auto; padding: 0 20px 12px; }
  .btn-send { appearance: none; border: 0; width: 100%; height: 54px; border-radius: 18px; cursor: pointer; position: relative; overflow: hidden;
    color: #fff; font-weight: 700; font-size: 16.5px; background: var(--g-red);
    box-shadow: 0 8px 16px -8px rgba(var(--tint), .7); transition: transform .1s, opacity .2s; }
  .btn-send:active { transform: scale(.98); }
  .btn-send:disabled { opacity: .45; box-shadow: none; }
  .btn-send .prog { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255, 255, 255, .22); transition: width .3s; }
  .btn-send .lbl { position: relative; }
  .nav { position: relative; display: flex; align-items: center; justify-content: space-around; max-width: 640px; margin: 0 auto;
    background: var(--card); border-radius: 26px 26px 0 0; padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px);
    border-top: 1px solid var(--line); box-shadow: 0 -4px 14px -10px rgba(16, 24, 40, .2); }
  .nav > * { appearance: none; border: 0; background: none; cursor: pointer; display: grid; justify-items: center; gap: 3px;
    font-size: 11px; font-weight: 600; color: var(--muted); width: 64px; padding: 4px 0; }
  .nav svg { width: 22px; height: 22px; }
  .nav .act { color: var(--primary); }
  .nav .fab { width: 64px; height: 64px; border-radius: 50%; place-items: center; margin-top: -34px; padding: 0; color: #fff;
    background: var(--g-red); box-shadow: 0 8px 16px -6px rgba(var(--tint), .7), 0 0 0 6px var(--bg); }
  .nav .fab svg { width: 28px; height: 28px; }
  .nav .fab:active { transform: scale(.94); }

  /* Ayarlar: alttan açılan sayfa */
  dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 640px; max-height: 92dvh;
    background: var(--bg); color: var(--ink); border-radius: 26px 26px 0 0; overflow: auto; padding-bottom: env(safe-area-inset-bottom); }
  dialog.sheet[open] { animation: up .28s cubic-bezier(.2, .8, .2, 1); }
  dialog.sheet::backdrop { background: rgba(10, 14, 28, .45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .sheet-head { display: flex; align-items: center; padding: 12px 20px 0; position: relative; }
  .sheet-head::before { content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: var(--line); }
  .sheet-head h2 { flex: 1; margin: 16px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
  .close { appearance: none; border: 0; width: 40px; height: 40px; margin-top: 16px; border-radius: 13px; cursor: pointer;
    display: grid; place-items: center; background: var(--card); color: var(--muted); box-shadow: var(--shadow); }
  .close svg { width: 16px; height: 16px; }
  .sheet-body { padding: 14px 20px 26px; display: flex; flex-direction: column; gap: 10px; }
  .section-t { font-size: 16px; font-weight: 700; margin: 8px 2px 0; }
  .set { padding: 4px 14px; }
  .set-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .set-row + .set-row { border-top: 1px solid var(--line); }
  .set-row > label, .set-row > span:not(.sq) { flex: 1; font-weight: 650; }
  .set-row .seg { box-shadow: none; background: var(--field); padding: 3px; border-radius: 12px; }
  .set-row .seg button { padding: 7px 11px; font-size: 13.5px; flex: none; }
  .set-in { width: 46%; font: inherit; font-size: 15px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--field); color: var(--ink); outline: none; text-align: right; }
  .set-in:focus { border-color: var(--primary); }
  .btn-soft { appearance: none; border: 0; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    background: var(--primary-soft); color: var(--primary); padding: 12px; margin: 6px 0 2px; border-radius: 14px; font-weight: 650; font-size: 15px; }
  .btn-soft svg { width: 19px; height: 19px; }
  .btn-soft.danger { background: var(--err-bg); color: var(--err); }
  .conn { min-height: 20px; font-size: 14px; font-weight: 650; text-align: center; padding: 6px 0 8px; color: var(--muted); }
  .conn.ok { color: var(--ok); }
  .conn.err { color: var(--err); }
  .hist-hint { margin: 2px 0 8px; text-align: center; color: var(--muted); font-size: 12.5px; }

  /* Şirket bilgileri: mavi katlanır kart */
  details.fold { padding: 0; overflow: hidden; }
  details.fold > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px; cursor: pointer; color: #fff;
    border-radius: 17px; background: var(--g-main); }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary .t { flex: 1; min-width: 0; }
  details.fold > summary small { display: block; font-size: 12.5px; color: rgba(255, 255, 255, .88); }
  details.fold > summary #sumName { display: block; font-weight: 750; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.fold > summary #sumName.empty { font-weight: 500; color: rgba(255, 255, 255, .88); }
  details.fold > summary::after { content: ""; flex: none; width: 9px; height: 9px; margin-right: 6px; border-right: 2.5px solid #fff;
    border-bottom: 2.5px solid #fff; transform: rotate(-45deg); opacity: .8; transition: transform .2s; }
  details.fold[open] > summary::after { transform: rotate(45deg); }
  .sumlogo { width: 46px; height: 46px; flex: none; border-radius: 12px; object-fit: contain; background: #fff; border: 1px solid var(--line); }
  .suminit { width: 46px; height: 46px; flex: none; border-radius: 12px; background: var(--primary-soft); color: var(--red); display: grid; place-items: center; font-weight: 800; }
  .fold-body { padding: 14px; }
  .hint { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  .logo-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }

  let lang = localStorage.getItem('lang') || (/^nl/i.test(navigator.language) ? 'nl' : 'tr');

    dur: it.dur, customer: it.customer, date: it.date, fileName: it.fileName })) : Promise.resolve();

  const AUDIO_EXT = { 'audio/mp4': 'm4a', 'audio/webm': 'webm', 'audio/ogg': 'ogg', 'audio/mpeg': 'mp3', 'audio/aac': 'aac' };

  function show(text, kind) {

  // ---------- Ekran ----------

  // Renkli kare simgeli satır; renk müşteri adından (aynı müşteri hep aynı renk).
  const colorOf = s => 'c' + [...s].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 5; // c5 (yeşil) sadece bağlantı simgesi
  function histRow(e, onDelete) {
    const fmt = new Intl.DateTimeFormat(lang === 'nl' ? 'nl-NL' : 'tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

    li.querySelector('b').textContent = e.c;

  // ---------- Şirket + müşteri bilgileri (offerte için, telefonda saklanır) ----------
  const FIRMA_F = [['naam', 'fNaam', 'organization'], ['adres', 'kAdres', 'street-address'], ['plaats', 'kPlaats', 'address-level2'],
    ['tel', 'kTel', 'tel', 'tel'], ['email', 'kEmail', 'email', 'email'], ['btw', 'fBtw'], ['iban', 'fIban'], ['betaling', 'fBetaling']];

  const store_ = (k, d) => JSON.parse(localStorage.getItem(k) || d);

  function fields(box, defs, values, onInput) {

      const inp = l.querySelector('input');

  }
  fields($('firmaFields'), FIRMA_F, firma(), (k, v) => { const f = firma(); f[k] = v; localStorage.setItem('firma', JSON.stringify(f)); if (k === 'naam') sumFirma(); });
  // Katlanır başlık: logo + firma adı; dolduysa kapalı açılır.
  function sumFirma() {
    const f = firma();

    $('sumName').textContent = f.naam || t('firmaEmpty');

  fields($('klantFields'), KLANT_F, {}, () => {

  // Aynı müşteri tekrar yazılınca bilgileri kendiliğinden dolsun.

  $('logoIn').addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = '';

    const img = new Image();
    img.src = URL.createObjectURL(file);
    try { await img.decode(); } catch { return; } finally { URL.revokeObjectURL(img.src); }

  // ---------- Ayarlar ----------
  const sheet = $('settings');

  }

  $('closeSettings').onclick = () => sheet.close();
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); }); // boşluğa dokununca kapan
  for (const b of $('langSeg').children) b.onclick = () => { lang = b.dataset.lang; localStorage.setItem('lang', lang); $('msg').className = 'msg'; applyLang(); };
  $('worker').value = worker();
  $('worker').addEventListener('input', e => { localStorage.setItem('worker', e.target.value.trim()); sumFirma(); });

  async function post(body) {
    // text/plain: tarayıcı ön kontrol (CORS preflight) yapmaz, Apps Script bunu kabul eder.
    const res = await fetch(scriptUrl, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });

  if (!configured) {

  // Son müşteriler: aynı isim farklı yazılıp iki klasör açılmasın diye öneri olarak çıkar.
  const recent = JSON.parse(localStorage.getItem('recent') || '[]');
  $('recent').innerHTML = recent.map(n => `<option value="${n.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}">`).join('');
  $('note').value = localStorage.getItem('noteDraft') || '';

  // iPhone fotoğrafları 4–12 MB; küçültüp JPEG yaparak hem telefonda az yer kaplar hem hızlı gider.
  async function toJpeg(file) {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    try { await img.decode(); } finally { URL.revokeObjectURL(img.src); }
    const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * scale);
    c.height = Math.round(img.naturalHeight * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
    c.width = c.height = 0; // iOS Safari'de canvas belleğini hemen bırak
    if (!blob) throw new Error('jpeg');
    return blob;
  }

  async function add(files) {
    for (const file of files) {
      let blob;
      try { blob = await toJpeg(file); } catch { show(t('badImg'), 'err'); continue; }
      const it = { id: newId(), kind: 'photo', blob, customer: null, date: null, fileName: null, state: '' };
      items.push(it);
      render(it);

  // ---------- Mikrofon ----------
  // Sesle yazma: Web Speech API (Android Chrome'da var; iPhone ana ekran uygulamasında çoğu zaman yok → düğme gizlenir,
  // orada klavyedeki 🎤 aynı işi görür). Sesli mesaj: MediaRecorder (iPhone + Android).
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const MAX_REC = 300; // 5 dk ≈ 2,5 MB; Apps Script istek sınırının çok altında kalır
  let dict = null, recorder = null;
  $('dictate').hidden = !SR;
  $('record').hidden = !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  function micUI() {
    $('dictate').classList.toggle('on', !!dict);
    $('record').classList.toggle('on', !!recorder);
    $('dictate').disabled = !!recorder;
    $('record').disabled = !!dict;
    $('dictLbl').textContent = t(dict ? 'listening' : 'dictate');

  }

  $('dictate').onclick = () => {
    if (dict) { dict.stop(); return; }
    const r = new SR();
    r.lang = lang === 'nl' ? 'nl-NL' : 'tr-TR';
    r.continuous = true;
    r.interimResults = true;
    const before = $('note').value.replace(/\s+$/, '');
    r.onresult = e => {
      const said = [...e.results].map(x => x[0].transcript.trim()).join(' ');
      $('note').value = (before ? before + ' ' : '') + said;
      localStorage.setItem('noteDraft', $('note').value);
      refresh();
    };
    r.onerror = e => { if (/not-allowed/.test(e.error)) show(t('micDenied'), 'err'); };
    r.onend = () => { dict = null; micUI(); };
    dict = r; micUI();
    try { r.start(); } catch { dict = null; micUI(); }
  };

  $('record').onclick = async () => {
    if (recorder) { recorder.stop(); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { show(t('micDenied'), 'err'); return; }
    // iPhone audio/mp4 (m4a) kaydeder, Android çoğunlukla webm; ikisi de ofiste açılır.
    const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg']
      .find(x => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x));
    const rec = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: 64000 }, type && { mimeType: type }));
    const chunks = [], t0 = Date.now();
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    const tick = setInterval(() => {
      const sec = Math.floor((Date.now() - t0) / 1000);
      $('recLbl').textContent = t('recording', { t: fmtDur(sec) });
      if (sec >= MAX_REC && rec.state === 'recording') rec.stop();
    }, 250);
    rec.onstop = async () => {
      clearInterval(tick);
      stream.getTracks().forEach(tr => tr.stop());
      recorder = null; micUI();
      const dur = Math.round((Date.now() - t0) / 1000);
      const blob = new Blob(chunks, { type: (rec.mimeType || type || 'audio/webm').split(';')[0] });
      if (!blob.size || dur < 1) return;
      const it = { id: newId(), kind: 'audio', blob, dur, customer: null, date: null, fileName: null, state: '' };
      items.push(it);
      render(it);
      refresh();
      await dbPut(it);
    };
    rec.start(1000);
    recorder = rec; micUI();
    $('recLbl').textContent = t('recording', { t: '0:00' });
  };
  // Uygulamadan çıkılırsa kaydı bitir ve sakla (arka planda mikrofon zaten kesilir).
  document.addEventListener('visibilitychange', () => { if (document.hidden && recorder) recorder.stop(); });

  // Bekleyen offerte'ler: ilgili fotoğraflar gidince Google'da taslak yapılır (internet yoksa sonra).
  const pendingOff = () => store_('pendingOfferte', '[]');
  const dropOff = o => localStorage.setItem('pendingOfferte', JSON.stringify(pendingOff().filter(x => !(x.c === o.c && x.d === o.d))));
  function firmaPayload() {
    const f = store_('firma', '{}'), out = { ...f }; // sadece telefonda girilenler; boşsa Google kartvizit bilgilerini kullanır
    delete out.logo;
    const m = /^data:(image\/(?:png|jpeg));base64,(.+)$/.exec(f.logo || '');
    if (m) { out.logoType = m[1]; out.logo = m[2]; }
    return out;
  }
  function showLink(text, url) {
    const m = $('msg'), box = document.createElement('div');
    box.append(Object.assign(document.createElement('span'), { textContent: text }),
      Object.assign(document.createElement('a'), { className: 'ob', href: url, target: '_blank', rel: 'noopener', textContent: t('openOfferte') }));
    m.replaceChildren(box);
    m.className = 'msg show ok'; // kendiliğinden kapanmaz
    m.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  let offBusy = false;
  async function makeOffertes() {
    if (offBusy || !navigator.onLine) return;
    offBusy = true;
    try {
      for (const o of pendingOff()) {
        if (items.some(i => i.customer === o.c && i.date === o.d && i.state !== 'done')) continue; // fotoğraflar henüz gitmedi
        show(t('offerteMaking', { c: o.c }), 'info');
        let out;
        try { out = await post({ key, action: 'offerte', customer: o.c, date: o.d, klant: o.klant, firma: firmaPayload() }); }
        catch { show(t('offline', { n: 1 }), 'info'); break; } // ağ hatası: sonra tekrar denenir
        dropOff(o); // sunucu cevap verdi: başarılı da olsa hatalı da olsa tekrar sorma
        if (out.ok) showLink(t('offerteReady', { c: o.c }), out.url);
        else show(t('offerteFail', { err: out.error }), 'err');
      }
    } finally { offBusy = false; }
  }

  // ---------- Gönderme ----------
  const b64 = blob => new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok(r.result.slice(r.result.indexOf(',') + 1));
    r.onerror = () => no(r.error);
    r.readAsDataURL(blob);
  });

  async function upload(it) {
    const body = { key, customer: it.customer, date: it.date, fileName: it.fileName,
      mimeType: it.blob.type.split(';')[0] || 'image/jpeg', data: await b64(it.blob) };
    let last;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const out = await post(body);
        if (out.ok) return;
        last = new Error(out.error || '?');
        if (/anahtar/i.test(last.message)) break; // tekrar denemek işe yaramaz
      } catch (e) { last = e; if (!navigator.onLine) break; }
      await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
    }
    throw last;
  }

  $('send').onclick = async () => {
    const customer = $('customer').value.replace(/\s+/g, ' ').trim();
    const fresh = items.filter(i => !i.customer);
    const text = $('note').value.trim();
    const wantOff = offerteOn;
    if (fresh.length || text || wantOff) {
      if (!customer) { show(t('needCustomer'), 'err'); $('customer').focus(); return; }
      // Gönder'e basıldığı an fotoğraflar bu müşteriye/güne bağlanır; internet sonra gelse de doğru klasöre gider.
      const date = today(), st = stamp(), who = fileSafe(worker());
      let np = 0, na = 0;
      for (const it of fresh) {
        const audio = it.kind === 'audio';
        const first = audio ? t('voiceFile') : '';
        const ext = audio ? AUDIO_EXT[it.blob.type] || 'webm' : 'jpg';
        Object.assign(it, { customer, date, state: 'queued',
          fileName: [first, st, who, audio ? ++na : ++np].filter(Boolean).join('_') + '.' + ext });
      }
      if (text) {
        const head = `${t('customer')}: ${customer}\n${t('dateL')}: ${date}` + (worker() ? `\n${t('byL')}: ${worker()}` : '');
        items.push({ id: newId(), kind: 'note', blob: new Blob([`${head}\n\n${text}\n`], { type: 'text/plain' }),
          customer, date, state: 'queued', fileName: [t('noteFile'), st, who].filter(Boolean).join('_') + '.txt' });
      }
      await Promise.all(items.filter(i => i.state === 'queued').map(dbPut));
      fresh.forEach(paint);
      $('note').value = ''; localStorage.removeItem('noteDraft');
      const r = [customer, ...JSON.parse(localStorage.getItem('recent') || '[]').filter(n => n.toLowerCase() !== customer.toLowerCase())].slice(0, 30);
      localStorage.setItem('recent', JSON.stringify(r));
      if (wantOff) {
        const list = pendingOff().filter(o => !(o.c === customer && o.d === date));
        list.push({ c: customer, d: date, klant: klantNow() });
        localStorage.setItem('pendingOfferte', JSON.stringify(list));
        setOfferte(false);
      }
    }
    drain(true);
  };

  async function drain(manual) {
    if (busy) return;
    const todo = items.filter(i => i.customer && i.state !== 'done');
    if (!todo.length || (!manual && !navigator.onLine)) { refresh(); makeOffertes(); return; }
    busy = true; refresh();
    $('msg').className = 'msg';
    let sent = 0, failed = 0, lastErr;
    const log = new Map(); // müşteri|gün → { c, d, p, a, note }
    for (const [n, it] of todo.entries()) {
      if (!navigator.onLine) break; // kalanlar telefonda bekler
      it.state = 'sending'; paint(it);
      $('sendLbl').textContent = t('sending', { i: n + 1, n: todo.length });
      try {
        await upload(it);
        it.state = 'done'; sent++;
        await dbDel(it.id);
        const k = it.customer + '|' + it.date;
        const e = log.get(k) || { c: it.customer, d: it.date, p: 0, a: 0, note: false };
        if (it.kind === 'note') e.note = true; else if (it.kind === 'audio') e.a++; else e.p++;
        log.set(k, e);
      } catch (e) { it.state = 'fail'; failed++; lastErr = e; }
      paint(it);
      $('prog').style.width = `${((n + 1) / todo.length) * 100}%`;
    }
    busy = false;
    $('prog').style.width = '0';
    for (const it of todo) if (it.state === 'fail' || it.state === 'sending') { it.state = 'queued'; paint(it); }

    if (log.size) {
      const h = [...[...log.values()].map(e => ({ ...e, at: Date.now() })), ...JSON.parse(localStorage.getItem('history') || '[]')].slice(0, 30);
      localStorage.setItem('history', JSON.stringify(h));
      renderHistory();
    }
    const left = items.filter(i => i.customer && i.state !== 'done').length;
    if (left && !navigator.onLine) show(t('offline', { n: left }), 'info');
    else if (failed) show(t('failed', { sent, failed, err: lastErr && lastErr.message }), 'err');
    else if (sent) {
      const e = [...log.values()];
      const what = summary(e.reduce((s, x) => s + x.p, 0), e.reduce((s, x) => s + (x.a || 0), 0), e.some(x => x.note));
      show(t('sentOk', { c: [...new Set(e.map(x => x.c))].join(', '), what }), 'ok');
    }
    makeOffertes();
    setTimeout(() => { for (const it of items.filter(i => i.state === 'done')) drop(it); refresh(); }, 1500);
    refresh();
  }

  // Telefonda kalanları geri yükle; internet gelince / uygulama öne gelince kendiliğinden gönder.
  for (const it of (await dbAll()).sort((a, b) => a.id < b.id ? -1 : 1)) {
    it.state = it.customer ? 'queued' : '';
    items.push(it);
    if (it.kind !== 'note') render(it);
  }
  addEventListener('online', () => drain());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) drain(); });
  if (!db) addEventListener('beforeunload', e => { if (items.some(i => i.state !== 'done')) e.preventDefault(); });
  refresh();
  drain();
})();
</script>
</body>
</html>
